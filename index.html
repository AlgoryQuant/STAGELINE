<head>

  <style>
    /* Temporary gate â€” full site lives in home.html */
    :root {
      --bg: #050505;
      --ink: #f2f2f2;
      --muted: #9a9a9a;
      --line: #e8e8e8;
      --font-display: "Anton", Impact, sans-serif;
      --font-poster: "Bebas Neue", "Arial Narrow", sans-serif;
      --font-body: "Space Grotesk", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      opacity: 0.035;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .gate {
      position: relative;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
      isolation: isolate;
    }

    .gate-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .gate-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      filter: grayscale(1) contrast(1.26) brightness(1.08) saturate(0);
      transform: scale(1.04);
      transform-origin: 50% 40%;
      animation: kenBurns 42s ease-in-out infinite alternate;
    }

    .gate-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.28) 45%, rgba(0, 0, 0, 0.35) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, transparent 28%, transparent 55%, rgba(0, 0, 0, 0.72) 100%);
    }

    @keyframes kenBurns {
      from { transform: scale(1.03) translate3d(0, 0, 0); }
      to { transform: scale(1.09) translate3d(-0.7%, -0.4%, 0); }
    }

    .gate-inner {
      position: relative;
      text-align: center;
      max-width: 28rem;
      animation: riseIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .gate-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 2.25rem;
    }

    .gate-brand strong {
      font-family: var(--font-poster);
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 400;
      letter-spacing: 0.18em;
      line-height: 1;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.7);
    }

    .soundwave {
      width: 7.5rem;
      height: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
    }

    .gate-title-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      margin-bottom: 0.85rem;
    }

    .gate-title {
      font-family: var(--font-display);
      font-size: clamp(2.6rem, 9vw, 4.4rem);
      line-height: 0.9;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #fff;
      text-shadow:
        0 1px 0 rgba(0, 0, 0, 0.55),
        0 4px 28px rgba(0, 0, 0, 0.7);
    }

    .gate-spinner {
      width: 0.85em;
      height: 0.85em;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .gate-copy {
      font-size: clamp(0.92rem, 2vw, 1.05rem);
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
      max-width: 22rem;
      margin: 0 auto 2rem;
    }

    .gate-ig {
      display: inline-block;
      font-family: var(--font-poster);
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.65rem 1.35rem;
      border: 1px solid rgba(255, 255, 255, 0.55);
      color: #fff;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .gate-ig:hover {
      background: #fff;
      color: #050505;
      border-color: #fff;
    }

    .gate-rule {
      width: 2.5rem;
      height: 1px;
      background: var(--line);
      margin: 0 auto 1.35rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="gate" aria-label="PĹ™ipravujeme">
    <div class="gate-bg" aria-hidden="true">

    </div>

          <path d="M0 7h28M32 7h8M44 3v8M50 1v12M56 4v6M62 2v10M68 5v4M76 7h44" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </div>

      <div class="gate-rule" aria-hidden="true"></div>

      <div class="gate-title-row">
        <h1 class="gate-title">PĹ™ipravujeme</h1>
        <span class="gate-spinner" aria-hidden="true"></span>
      </div>

      <p class="gate-copy">

      </p>

      <a
        class="gate-ig"
        href="https://www.instagram.com/_stage.line_/"
        target="_blank"
        rel="noopener"
      >@_stage.line_</a>
    </div>
  </main>
</body>
</html>
